name: Keep Render apps awake

# Render 무료 플랜은 계정당 월 750시간(≈한 달 730시간)이라 두 서비스를 24시간 깨워둘 수 없다.
# 채용 담당자가 링크를 여는 시간대(평일 업무시간)에만 깨워서 예산 안에 맞춘다.
#   평일 11시간 × 22일 ≈ 242시간/서비스 → 두 개 합쳐 약 484시간
#
# 자가 ping(앱 내부 스레드)으로는 이걸 못 한다. ping을 멈추면 앱이 잠들고,
# 잠들면 스레드도 같이 멈춰서 스스로 깨어나지 못하기 때문. 그래서 외부 트리거를 쓴다.
#
# 예약 실행은 보장되지 않는다 — 2026-09 실측: */14로 걸어도 실제로는 하루 3번(약 5시간 간격)만
# 돌았고, 그 사이 서비스가 잠들어 첫 응답이 18초였다. GitHub이 부하 때 스케줄 이벤트를 버린다.
# 그래서 "얼마나 자주 실행되는가"에 기대지 않고, 한 번 실행되면 그 안에서 반복 ping을 돌린다.

on:
  schedule:
    # UTC 00:00~11:59 = KST 09:00~20:59, 월~금.
    # 매시 정각에만 걸고, 한 실행이 약 50분을 커버한다(아래 루프).
    # 촘촘한 cron(*/14)은 GitHub이 더 많이 버려서 오히려 공백이 커졌다.
    - cron: "3 0-11 * * 1-5"
  workflow_dispatch: # 필요할 때 수동 실행

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 하나가 죽어도 나머지는 계속 깨움
      matrix:
        target:
          - name: LearnLog
            url: https://learn-log.onrender.com/
          - name: 잇다루프
            url: https://eatda-roop.onrender.com/
    steps:
      - name: Ping ${{ matrix.target.name }}
        # 한 실행 안에서 5분 간격으로 10번 = 약 50분. 다음 정각 실행과 이어져 공백이 없다.
        # Render 슬립 기준은 15분이라 5분 간격이면 여유가 있다.
        timeout-minutes: 55
        run: |
          fail=0
          for i in $(seq 1 10); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -m 90 --retry 2 --retry-delay 20 "${{ matrix.target.url }}")
            echo "[$i/10] $(date -u '+%H:%M:%SZ')  ${{ matrix.target.name }} → HTTP $code"
            # 슬립에서 깨어나는 중이면 5xx가 잠깐 나올 수 있어 실패로 보지 않는다.
            # 완전히 죽은 경우(000 = 연결 불가)만 센다.
            [ "$code" = "000" ] && fail=$((fail + 1))
            [ "$i" -lt 10 ] && sleep 300
          done
          # 한 번쯤 연결이 튀는 건 무시하고, 절반 이상 실패했을 때만 알린다.
          if [ "$fail" -ge 5 ]; then
            echo "::error::${{ matrix.target.name }} 10회 중 ${fail}회 응답 없음"
            exit 1
          fi
